services :
   - type : web
     name : filmigobot
     runtime : go
     repo : https://github.com/Jisin0/filmigobot.git
     buildCommand: go build .
     startCommand: python3 -m venv venv && ./venv/bin/pip install imdbinfo niquests && ./filmigobot
     envVars :
       - key : BOT_TOKEN
         value : your-bots-token
       - key : DEFAULT_SEARCH_METHOD
         value: jw
       - key : PORT
         value : 10000
